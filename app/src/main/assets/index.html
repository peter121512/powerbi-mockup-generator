<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>PBI Dashboard Mockup</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,sans-serif;background:#0d1117;color:#e6edf3;min-height:100vh;display:flex;flex-direction:column}
.header{background:linear-gradient(135deg,#1a237e,#283593);padding:14px;text-align:center}
.header h1{font-size:1.1em;color:#fff}
.header p{font-size:0.7em;color:#90caf9;margin-top:3px}
.main{flex:1;padding:14px;overflow-y:auto;padding-bottom:20px}
label{font-size:0.8em;color:#90caf9;margin-bottom:4px;display:block}
textarea{width:100%;height:90px;padding:10px;background:#161b22;border:1px solid #30363d;border-radius:8px;color:#e6edf3;font-size:0.85em;resize:vertical}
textarea:focus{outline:none;border-color:#58a6ff}
textarea::placeholder{color:#484f58}
.upload-area{margin:10px 0;padding:14px;background:#161b22;border:1px dashed #30363d;border-radius:8px;text-align:center;cursor:pointer}
.upload-area.has-image{border-color:#58a6ff;background:#0d1b2a}
.upload-area p{font-size:0.75em;color:#8b949e}
.upload-preview{max-width:100%;max-height:100px;border-radius:6px;margin-top:8px}
.examples{margin:8px 0;display:flex;flex-wrap:wrap;gap:5px}
.chip{padding:4px 9px;background:#21262d;border:1px solid #30363d;border-radius:12px;font-size:0.65em;color:#8b949e;cursor:pointer}
.chip:active{background:#30363d}
.btn{width:100%;padding:12px;background:linear-gradient(135deg,#1565c0,#1a237e);color:#fff;border:none;border-radius:8px;font-size:0.95em;font-weight:600;cursor:pointer;margin-top:8px}
.btn:disabled{opacity:0.4}
.btn:active:not(:disabled){transform:scale(0.98)}
.status{text-align:center;padding:16px;color:#8b949e;font-size:0.8em}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid #30363d;border-top-color:#58a6ff;border-radius:50%;animation:spin 0.8s linear infinite;margin-right:6px;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
.result{margin-top:12px;background:#fff;border-radius:10px;overflow:hidden;border:1px solid #30363d}
.result-html{width:100%;overflow-x:auto}
.result-meta{padding:8px;font-size:0.7em;color:#8b949e;background:#161b22}
.gallery{margin-top:16px}
.gallery h3{font-size:0.85em;color:#58a6ff;margin-bottom:8px}
.gallery-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.gallery-item{border-radius:6px;overflow:hidden;border:1px solid #30363d;cursor:pointer;background:#161b22}
.gallery-item .gi-label{padding:6px;font-size:0.6em;color:#8b949e;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gallery-item .gi-preview{height:60px;background:#1a237e;display:flex;align-items:center;justify-content:center;color:#90caf9;font-size:9px;padding:4px;text-align:center}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#da3633;color:#fff;padding:8px 16px;border-radius:6px;font-size:0.8em;display:none;z-index:100}
</style></head><body>
<div class="header">
<h1>📊 Power BI Mockup Generator</h1>
<p>Describe or upload → instant dashboard mockup</p>
</div>
<div class="main">
<label>Dashboard description:</label>
<textarea id="input" placeholder="e.g., HR analytics showing headcount by department, attrition rate trend, avg tenure, and diversity metrics..."></textarea>

<div class="upload-area" id="uploadArea" onclick="document.getElementById('fileInput').click()">
<p>📷 Tap to upload a reference image (optional)</p>
<input type="file" id="fileInput" accept="image/*" style="display:none" onchange="handleImage(event)">
<img id="preview" class="upload-preview" style="display:none">
</div>

<div class="examples">
<div class="chip" onclick="use(this)">Sales performance KPIs</div>
<div class="chip" onclick="use(this)">HR headcount & attrition</div>
<div class="chip" onclick="use(this)">Financial P&L summary</div>
<div class="chip" onclick="use(this)">Marketing campaign ROI</div>
<div class="chip" onclick="use(this)">IT service desk metrics</div>
<div class="chip" onclick="use(this)">Customer satisfaction NPS</div>
</div>

<button class="btn" id="genBtn" onclick="generate()">🎨 Generate Mockup</button>
<div id="status" class="status" style="display:none"></div>
<div id="result" class="result" style="display:none"></div>

<div class="gallery" id="gallery" style="display:none">
<h3>Previous mockups</h3>
<div class="gallery-grid" id="galleryGrid"></div>
</div>
</div>
<div class="toast" id="toast"></div>

<script>
var API = 'https://5e5q4t9j0k.execute-api.eu-west-1.amazonaws.com/generate';
var imageData = '';
var history = JSON.parse(localStorage.getItem('pbi_history') || '[]');

function use(el){ document.getElementById('input').value = el.textContent; }

function handleImage(e){
  var file = e.target.files[0];
  if(!file) return;
  var reader = new FileReader();
  reader.onload = function(ev){
    imageData = ev.target.result.split(',')[1]; // base64 without prefix
    var preview = document.getElementById('preview');
    preview.src = ev.target.result;
    preview.style.display = 'block';
    document.getElementById('uploadArea').classList.add('has-image');
  };
  reader.readAsDataURL(file);
}

function generate(){
  var desc = document.getElementById('input').value.trim();
  if(!desc && !imageData){ showToast('Enter a description or upload an image'); return; }
  if(!desc) desc = 'Dashboard based on uploaded reference image';
  
  var btn = document.getElementById('genBtn');
  var status = document.getElementById('status');
  btn.disabled = true;
  status.style.display = 'block';
  status.innerHTML = '<span class="spinner"></span>Generating... (5-15s)';
  document.getElementById('result').style.display = 'none';
  
  var payload = {description: desc};
  if(imageData) payload.image = imageData;
  
  var xhr = new XMLHttpRequest();
  xhr.open('POST', API, true);
  xhr.setRequestHeader('Content-Type', 'application/json');
  xhr.timeout = 60000;
  xhr.onload = function(){
    btn.disabled = false;
    try {
      var data = JSON.parse(xhr.responseText);
      if(data.success && data.html){
        showResult(data.html, desc);
        saveHistory(desc, data.html);
        status.innerHTML = '✅ Done! Scroll down.';
      } else {
        status.innerHTML = '❌ ' + (data.error || 'Generation failed');
      }
    } catch(e){
      status.innerHTML = '❌ Response error';
    }
  };
  xhr.onerror = function(){ btn.disabled=false; status.innerHTML='❌ Network error'; };
  xhr.ontimeout = function(){ btn.disabled=false; status.innerHTML='❌ Timeout'; };
  xhr.send(JSON.stringify(payload));
}

function showResult(html, desc){
  var r = document.getElementById('result');
  r.style.display = 'block';
  r.innerHTML = '<div class="result-html">' + html + '</div><div class="result-meta">📋 ' + desc + '</div>';
}

function saveHistory(desc, html){
  history.unshift({desc:desc, html:html.substring(0,6000), t:Date.now()});
  if(history.length > 8) history = history.slice(0,8);
  try{ localStorage.setItem('pbi_history', JSON.stringify(history)); } catch(e){}
  renderGallery();
}

function renderGallery(){
  if(!history.length){ document.getElementById('gallery').style.display='none'; return; }
  document.getElementById('gallery').style.display='block';
  var g = document.getElementById('galleryGrid');
  g.innerHTML = history.map(function(h,i){
    return '<div class="gallery-item" onclick="showResult(history['+i+'].html,history['+i+'].desc)"><div class="gi-preview">'+h.desc.substring(0,50)+'</div><div class="gi-label">'+h.desc+'</div></div>';
  }).join('');
}

function showToast(msg){
  var t=document.getElementById('toast');t.textContent=msg;t.style.display='block';
  setTimeout(function(){t.style.display='none';},2500);
}

renderGallery();
</script></body></html>
